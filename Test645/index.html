<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 한국어 문서임을 명시해 브라우저 자동 번역 배너가 뜨지 않게 한다. -->
    <meta name="google" content="notranslate" />
    <meta name="format-detection" content="telephone=no" />
    <title>로또 머신</title>
    <script type="module" crossorigin src="./assets/index-DEzFn6fa.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-o5FTOlWB.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 임시 진단: 로드 시점 에러를 window.__errs 로 남긴다.
      window.__errs = [];
      window.addEventListener('error', (e) => {
        window.__errs.push('ERR: ' + e.message + ' @ ' + (e.filename || '?') + ':' + (e.lineno || '?') + ' :: ' + (e.error && e.error.stack ? e.error.stack : String(e.error)));
      });
      window.addEventListener('unhandledrejection', (e) => {
        window.__errs.push('REJ: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
      });
    </script>
  </body>
</html>
