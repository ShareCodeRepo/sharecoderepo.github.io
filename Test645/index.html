  <body>
    <div id="root"></div>
    <script>
      // 임시 진단: 로드 시점 에러를 window.__errs 로 남긴다.
      window.__errs = [];
      window.addEventListener('error', (e) => {
        window.__errs.push('ERR: ' + e.message + ' @ ' + (e.filename || '?') + ':' + (e.lineno || '?'));
      });
      window.addEventListener('unhandledrejection', (e) => {
        window.__errs.push('REJ: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
      });
    </script>
  </body>
